<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fretboard Tools</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500,700,900" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font@latest/css/materialdesignicons.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            width: 100%;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 40px;
            font-weight: 300;
            font-size: 3rem;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .menu-item {
            background: white;
            border-radius: 12px;
            padding: 30px;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .menu-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }
        .icon {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #2196F3;
        }
        .title {
            font-size: 1.5rem;
            font-weight: 500;
            margin-bottom: 10px;
            color: #1976D2;
        }
        .description {
            font-size: 0.95rem;
            color: #666;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Fretboard Tools</h1>
        <div class="menu-grid">
            <a href="chord.html" class="menu-item">
                <i class="mdi mdi-music-note-eighth icon"></i>
                <div class="title">Chord Search</div>
                <div class="description">フレットボード上のポジションからコード名を逆引き検索します。</div>
            </a>
            <a href="position.html" class="menu-item">
                <i class="mdi mdi-guitar-acoustic icon"></i>
                <div class="title">Position / Form</div>
                <div class="description">指定したキーやスケールの指板上のポジションや、CAGEDフォーム等を確認します。</div>
            </a>
            <a href="scale.html" class="menu-item">
                <i class="mdi mdi-music-clef-treble icon"></i>
                <div class="title">Scale Search</div>
                <div class="description">使用されている音やコード進行から、適合するスケールを検索・提案します。</div>
            </a>
        </div>
    </div>
</body>
</html>
